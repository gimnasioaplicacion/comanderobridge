<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Comandero Bridge</title>
<style>
  :root { color-scheme: dark; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
  body { margin: 0; padding: max(24px, env(safe-area-inset-top)) 24px 24px; background: #0f172a; color: #e2e8f0; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .muted { color: #94a3b8; font-size: 13px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-top: 16px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
  button { width: 100%; padding: 12px 16px; background: #e2552b; color: #fff; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600; }
  button.secondary { background: transparent; border: 1px solid #475569; color: #e2e8f0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; display: inline-block; }
  .dot.on { background: #22c55e; } .dot.err { background: #ef4444; }
  .err { color: #f87171; font-size: 12px; margin-top: 8px; }
  .ok { color: #4ade80; font-size: 12px; margin-top: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
  .sp { height: 12px; }
</style>
</head>
<body>
  <h1>Comandero Bridge</h1>
  <div class="muted"><span id="subtitle">Cargando…</span> · v<span id="ver">1.0.0</span></div>

  <div id="unpaired" class="card" style="display:none">
    <label>Código de emparejamiento (6 dígitos)</label>
    <input id="code" maxlength="6" inputmode="numeric" placeholder="123456" />
    <div class="sp"></div>
    <button id="pairBtn">Vincular</button>
    <div id="pairErr" class="err"></div>
    <p class="muted">Pídelo en la app web: <strong>Admin → Impresoras → Agentes locales → Vincular nuevo agente</strong>.</p>
  </div>

  <div id="paired" class="card" style="display:none">
    <div class="row"><span class="dot" id="dot"></span><strong id="statusText">Iniciando…</strong></div>
    <div class="muted" id="lastJob" style="margin-top:6px"></div>
    <div class="sp"></div>
    <div class="muted">Mantén esta app abierta en el dispositivo principal. Las impresoras WiFi/LAN se configuran en la app web con su IP y puerto 9100.</div>
    <div class="sp"></div>
    <label>Probar impresora de red por IP</label>
    <div class="grid2">
      <input id="testHost" placeholder="192.168.1.50" />
      <input id="testPort" type="number" value="9100" />
    </div>
    <div class="sp"></div>
    <button class="secondary" id="testBtn">Imprimir prueba por IP</button>
    <div id="testMsg"></div>
    <div class="sp"></div>
    <button class="secondary" id="unpairBtn">Desvincular este agente</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
