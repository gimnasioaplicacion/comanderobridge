<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Comandero Bridge</title>
<style>
  :root { color-scheme: dark; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
  html, body { height: 100%; }
  body { margin: 0; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .agentHotspot {
    position: fixed; top: max(6px, env(safe-area-inset-top)); left: 6px; z-index: 30;
    width: 20px; height: 20px; padding: 0; margin: 0; border-radius: 50%;
    background: rgba(11,18,32,0.18); border: 1px solid rgba(148,163,184,0.15);
    color: #e2e8f0; opacity: 0.35; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .agentHotspot .dot { width: 6px; height: 6px; }
  .agentHead { display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
  .agentHead button { width:auto; padding:8px 14px; font-size:13px; background:transparent; border:1px solid #475569; color:#e2e8f0; border-radius:8px; }
  main { flex: 1; position: relative; min-height: 0; }
  .pane { position: absolute; inset: 0; }
  .pane[hidden] { display: none; }
  #webPane iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #bridgePane { overflow: auto; padding: max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; background: rgba(15,23,42,0.97); z-index: 20; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .muted { color: #94a3b8; font-size: 13px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-top: 16px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
  button { width: 100%; padding: 12px 16px; background: #e2552b; color: #fff; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600; }
  button.secondary { background: transparent; border: 1px solid #475569; color: #e2e8f0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; display: inline-block; }
  .dot.on { background: #22c55e; } .dot.err { background: #ef4444; }
  .err { color: #f87171; font-size: 12px; margin-top: 8px; }
  .ok { color: #4ade80; font-size: 12px; margin-top: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
  .sp { height: 12px; }
</style>
</head>
<body>
  <main>
    <!-- Comandero se ejecuta dentro de la propia app: agente y web activos a la vez -->
    <section id="webPane" class="pane">
      <iframe id="posFrame" src="https://pos.comandero.online" allow="clipboard-read; clipboard-write; camera; fullscreen"></iframe>
    </section>

    <section id="bridgePane" class="pane" hidden>
      <div class="agentHead">
        <h1>Agente de impresión</h1>
        <button id="closeAgent" type="button">Cerrar</button>
      </div>
      <span class="dot" id="dotTop" style="display:none"></span>
      <div class="muted"><span id="subtitle">Cargando…</span> · v<span id="ver">1.0.0</span></div>

      <div id="unpaired" class="card" style="display:none">
        <label>Código de emparejamiento (6 dígitos)</label>
        <input id="code" maxlength="6" inputmode="numeric" placeholder="123456" />
        <div class="sp"></div>
        <button id="pairBtn">Vincular</button>
        <div id="pairErr" class="err"></div>
        <p class="muted">Pídelo en la app web: <strong>Admin → Impresoras → Agentes locales → Vincular nuevo agente</strong>.</p>
      </div>

      <div id="paired" class="card" style="display:none">
        <div class="row"><span class="dot" id="dot"></span><strong id="statusText">Iniciando…</strong></div>
        <div class="muted" id="lastJob" style="margin-top:6px"></div>
        <div class="sp"></div>
        <div class="muted">Comandero se abre dentro de esta app, así el agente nunca queda en segundo plano. Las impresoras WiFi/LAN se configuran en Comandero con su IP y puerto 9100.</div>
        <div class="sp"></div>
        <label>Probar impresora de red por IP</label>
        <div class="grid2">
          <input id="testHost" placeholder="192.168.1.50" />
          <input id="testPort" type="number" value="9100" />
        </div>
        <div class="sp"></div>
        <button class="secondary" id="testBtn">Imprimir prueba por IP</button>
        <div id="testMsg"></div>
        <div class="sp"></div>
        <button class="secondary" id="unpairBtn">Desvincular este agente</button>
      </div>
    </section>
  </main>

  <button id="openAgent" type="button" class="agentHotspot" aria-label="Abrir agente de impresión"><span class="dot"></span></button>

  <script>
    (function () {
      var bridge = document.getElementById('bridgePane');
      document.getElementById('openAgent').onclick = function () { bridge.hidden = false; };
      document.getElementById('closeAgent').onclick = function () { bridge.hidden = true; };
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
